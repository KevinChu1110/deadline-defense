# Netlify — 只託管前端靜態；API 走 ngrok（sit-kevin）
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # API 同源:走 Netlify Edge Function(/defense-api/*)反代到 ngrok 並補 skip header,
  # 繞過 ngrok 攔截頁 + session cookie 變第一方(手機也能登入)。見 netlify/edge-functions/api-proxy.js
  VITE_API_BASE = "/defense-api"
  # 前端 root，不要 /defense base
  VITE_BASE = "/"

# Edge Function 反代 /defense-api/* → ngrok(補 skip header);先於 SPA fallback
[[edge_functions]]
  path = "/defense-api/*"
  function = "api-proxy"

# SPA fallback(不含 /defense-api,已被 edge function 攔)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
