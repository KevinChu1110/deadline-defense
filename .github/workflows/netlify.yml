name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build
        env:
          # API 同源:走 Netlify Edge Function /defense-api 反代(繞 ngrok 攔截頁+第一方cookie)
          VITE_API_BASE: /defense-api

      # 用 netlify-cli 部署:會一併打包 netlify.toml 宣告的 edge functions
      # (原 nwtgck/actions-netlify 只傳 dist,不含 edge function → 手機登入修復會失效)
      - name: Deploy to Netlify (含 edge functions)
        run: npx --yes netlify-cli@latest deploy --prod --dir=dist --message "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
